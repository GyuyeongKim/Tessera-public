name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SQLITE_ZIP: https://sqlite.org/2026/sqlite-amalgamation-3540100.zip
  SQLITE_OLD_ZIP: https://www.sqlite.org/2022/sqlite-amalgamation-3370200.zip
  SPARK_TGZ: https://archive.apache.org/dist/spark/spark-4.2.0/spark-4.2.0-bin-hadoop3.tgz
  SCALA_TGZ: https://github.com/scala/scala/releases/download/v2.13.18/scala-2.13.18.tgz

jobs:
  linux:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: dnf install -y java-21-openjdk-devel zip unzip
      - name: SQLite sources
        run: |
          for u in "$SQLITE_ZIP" "$SQLITE_OLD_ZIP"; do curl -fsSL -o /tmp/s.zip "$u" && unzip -q -o /tmp/s.zip -d /tmp; done
          echo "SQLITE_SRC=/tmp/sqlite-amalgamation-3540100" >> "$GITHUB_ENV"
      - name: SQLite extension
        run: sqlite/build.sh
      - name: SQLite tests on SQLite 3.54.1 and 3.37.2
        run: |
          for v in 3540100 3370200; do
            gcc -O2 -o /tmp/sqlite3-$v /tmp/sqlite-amalgamation-$v/shell.c /tmp/sqlite-amalgamation-$v/sqlite3.c -ldl -lpthread -lm
            tests/sqlite.sh /tmp/sqlite3-$v sqlite/tessera.so
          done
      - name: JNI library
        run: |
          export JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          JNI_ONLY=1 spark/build.sh
      - name: Wheel
        run: |
          /opt/python/cp312-cp312/bin/python packaging/python/build_wheel.py --lib sqlite/tessera.so --plat linux_x86_64 --out /tmp/wheel
          auditwheel repair -w dist /tmp/wheel/*.whl
      - name: Artifacts
        run: |
          V=$(sed -n 's/.*kVersion = "\(.*\)";/\1/p' core/tessera.hpp)
          N=tessera-sqlite-$V-linux-x86_64
          mkdir -p /tmp/$N native/linux-x86_64
          cp sqlite/tessera.so LICENSE NOTICE /tmp/$N/
          tar -czf dist/$N.tar.gz -C /tmp $N
          cp spark/libtessera_jni.so native/linux-x86_64/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/
            native/

  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Tools
        run: brew install llvm libomp python@3.12
      - name: SQLite sources
        run: |
          for u in "$SQLITE_ZIP" "$SQLITE_OLD_ZIP"; do curl -fsSL -o /tmp/s.zip "$u" && unzip -q -o /tmp/s.zip -d /tmp; done
          echo "SQLITE_SRC=/tmp/sqlite-amalgamation-3540100" >> "$GITHUB_ENV"
      - name: SQLite extension
        run: sqlite/build.sh
      - name: SQLite tests on SQLite 3.54.1 and 3.37.2
        run: |
          for v in 3540100 3370200; do
            cc -O2 -o /tmp/sqlite3-$v /tmp/sqlite-amalgamation-$v/shell.c /tmp/sqlite-amalgamation-$v/sqlite3.c
            tests/sqlite.sh /tmp/sqlite3-$v sqlite/tessera.dylib
          done
      - name: JNI library
        run: JNI_ONLY=1 spark/build.sh
      - name: Wheel
        run: python3 packaging/python/build_wheel.py --lib sqlite/tessera.dylib --plat macosx_14_0_arm64 --out dist
      - name: Wheel test
        run: |
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cp packaging/python/smoke.py /tmp/smoke.py
          cd /tmp && /tmp/venv/bin/python /tmp/smoke.py
      - name: Artifacts
        run: |
          V=$(sed -n 's/.*kVersion = "\(.*\)";/\1/p' core/tessera.hpp)
          N=tessera-sqlite-$V-darwin-arm64
          mkdir -p /tmp/$N native/darwin-aarch64
          cp sqlite/tessera.dylib LICENSE NOTICE /tmp/$N/
          tar -czf dist/$N.tar.gz -C /tmp $N
          cp spark/libtessera_jni.dylib native/darwin-aarch64/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/
            native/

  wheel-linux-test:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: art
      - name: Wheel test
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install art/dist/*.whl
          cp packaging/python/smoke.py /tmp/smoke.py
          cd /tmp && /tmp/venv/bin/python /tmp/smoke.py

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 18
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-18 postgresql-server-dev-18
      - name: PGXN distribution
        run: packaging/pgxn/make_dist.sh dist
      - name: Build, install, and test from the distribution
        run: |
          cd /tmp && unzip -q "$GITHUB_WORKSPACE"/dist/tessera_pg-*.zip && cd tessera_pg-*/
          export PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config
          make -j"$(nproc)"
          sudo make install PG_CONFIG=$PG_CONFIG
          sudo chown -R postgres: .
          sudo -u postgres pg_virtualenv -v 18 make installcheck PG_CONFIG=$PG_CONFIG || { cat regression.diffs 2>/dev/null; exit 1; }
      - name: Adapter tests
        run: tests/postgres.sh /usr/lib/postgresql/18/bin
      - uses: actions/upload-artifact@v4
        with:
          name: pgxn
          path: dist/

  spark:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Spark and Scala
        run: |
          curl -fsSL "$SPARK_TGZ" | tar xz -C /tmp
          curl -fsSL "$SCALA_TGZ" | tar xz -C /tmp
          echo "SPARK_HOME=/tmp/spark-4.2.0-bin-hadoop3" >> "$GITHUB_ENV"
          echo "SCALAC=/tmp/scala-2.13.18/bin/scalac" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          spark/build.sh
          SPARK_DRIVER_MEMORY=6g tests/spark.sh
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: art/linux
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: art/macos
      - name: Maven artifacts
        run: |
          mkdir -p native
          cp -R art/linux/native/. art/macos/native/. native/
          packaging/maven/assemble.sh native dist/maven
      - name: Maven jar test
        run: |
          V=$(sed -n 's/.*kVersion = "\(.*\)";/\1/p' core/tessera.hpp)
          VIEW="CREATE TEMP VIEW r AS SELECT k, x FROM (SELECT CAST(id % 1000 AS BIGINT) AS k, CAST((id * 7) % 53 AS BIGINT) AS x FROM range(20000)) WHERE k IS NOT NULL AND x IS NOT NULL;"
          Q="SELECT COUNT(*), SUM(c) FROM (SELECT a.x, b.x, COUNT(*) AS c FROM r a JOIN r b ON a.k = b.k GROUP BY a.x, b.x);"
          for on in true false; do
            "$SPARK_HOME/bin/spark-sql" --master 'local[2]' --jars dist/maven/tessera-spark_2.13-$V.jar \
              --conf spark.sql.extensions=tessera.spark.TesseraExtensions --conf spark.tessera.enabled=$on \
              -e "$VIEW EXPLAIN SELECT a.x, b.x, COUNT(*) FROM r a JOIN r b ON a.k = b.k GROUP BY a.x, b.x; $Q" \
              > /tmp/maven_$on.out 2> /tmp/maven_$on.err || { tail -40 /tmp/maven_$on.err; exit 1; }
          done
          cat /tmp/maven_true.out
          grep -q TesseraExec /tmp/maven_true.out
          diff <(tail -1 /tmp/maven_true.out) <(tail -1 /tmp/maven_false.out)
      - uses: actions/upload-artifact@v4
        with:
          name: maven
          path: dist/maven/

  release:
    needs: [linux, macos, wheel-linux-test, postgres, spark]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=$GITHUB_REF_NAME
          gh release view "$T" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$T" -R "$GITHUB_REPOSITORY" --draft --verify-tag --title "Tessera ${T#v}" --notes "Tessera ${T#v}"
          gh release upload "$T" -R "$GITHUB_REPOSITORY" --clobber \
            art/linux/dist/*.tar.gz art/macos/dist/*.tar.gz art/linux/dist/*.whl art/macos/dist/*.whl \
            art/pgxn/*.zip art/maven/tessera-spark_2.13-*[0-9].jar
